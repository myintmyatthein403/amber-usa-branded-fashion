name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  NODE_VERSION: "22"

jobs:
  shared:
    name: shared — typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p packages/shared
      - run: npm run build -w packages/shared
      - run: npm run test -w packages/shared

  backend:
    name: backend — typecheck, build, test
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/shared
      - run: npx prisma generate --schema apps/backend/prisma/schema.prisma
      - run: npx tsc --noEmit -p apps/backend
      - run: npm run backend:build
      - run: npm run test:backend

  frontend:
    name: frontend — typecheck, build
    runs-on: ubuntu-latest
    needs: shared
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/shared
      - run: npx tsc --noEmit -p apps/frontend
      - run: npm run frontend:build

  admin:
    name: admin — typecheck, build
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/shared
      - run: npx tsc --noEmit -p apps/admin
      - run: npm run admin:build
